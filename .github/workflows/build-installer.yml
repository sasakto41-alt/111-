# ============================================================
#  Majestic Text Helper — автосборка установщика Windows
#
#  Как получить готовый Setup-EXE, ничего не собирая руками:
#    1. Сделать тег и запушить его:  git tag v3.12.0 && git push origin v3.12.0
#    2. Подождать ~5-10 минут (вкладка Actions).
#    3. Готовый файл появится на вкладке Releases:
#       https://github.com/sasakto41-alt/111-/releases
#    4. Его же можно скачать из артефактов запуска (Actions -> сборка -> Artifacts).
#
#  Запуск вручную: вкладка Actions -> "Build Windows Installer" -> Run workflow.
# ============================================================
name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Setup-EXE (PyInstaller + Inno Setup)
    runs-on: windows-latest

    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Зависимости (PySide6, keyboard, PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Сборка программы (PyInstaller)
        run: python -m PyInstaller --clean -y majestic_helper.spec

      - name: Проверить результат PyInstaller
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/MajesticTextHelper/MajesticTextHelper.exe")) {
            Write-Error "dist/MajesticTextHelper/MajesticTextHelper.exe не найден"
          }
          Write-Host "EXE собран"

      - name: Установить Inno Setup 6
        run: choco install innosetup -y --no-progress

      - name: Собрать установщик (ISCC)
        shell: pwsh
        run: |
          $m = Select-String -Path "app/__init__.py" -Pattern 'APP_VERSION\s*=\s*"([^"]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "Версия программы: $ver"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /D"APP_VERSION=$ver" "installer/majestic_helper.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Проверить установщик
        shell: pwsh
        run: |
          $exe = Get-ChildItem "release/*.exe" | Select-Object -First 1
          if (-not $exe) { Write-Error "Setup-EXE не найден в release/" }
          Write-Host "Готово: $($exe.Name) ($([math]::Round($exe.Length/1MB,1)) MB)"

      - name: Сохранить артефакт
        uses: actions/upload-artifact@v4
        with:
          name: MajesticTextHelper-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Опубликовать в GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
